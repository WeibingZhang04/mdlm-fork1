checkpoint_monitor:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  # Structured models override model.monitor_metric; ordinary models fall
  # back to val/nll without changing their configuration files.
  monitor: ${oc.select:model.monitor_metric,val/nll}
  mode: min # can be "max" or "min"
  save_top_k: 1 # save k best models (determined by above metric)
  save_last: False # True = additionally always save model from last epoch
  dirpath: ${checkpointing.save_dir}/checkpoints
  filename: best
  auto_insert_metric_name: False
  verbose: True
