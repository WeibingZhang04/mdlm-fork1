name: contextual-forest-small
type: ddit
monitor_metric: val/structured/conditional_nll_per_masked_token
hidden_size: 768
cond_dim: 128
length: 1024
n_blocks: 12
n_heads: 12
scale_by_sigma: True
dropout: 0.1
tie_word_embeddings: False

# Fixed/dynamic topology and factor modes are orthogonal ablations.  Setting
# independent_mode=true leaves the full head instantiated but neutralizes all
# pair factors.  This matches architecture parameter count; pair parameters
# are inactive and it is not an active-parameter/unary-adapter match.
structured_decoder:
  enabled: true
  top_k: 64
  rank: 16
  time_embed_dim: 64
  topology_dim: 128
  local_window: 2
  num_anchor_slots: 16
  contextual_neighbors: 4
  component_size_cap: 32
  topology_mode: dynamic
  factor_mode: dynamic
  independent_mode: false
  min_edge_score: null
  fixed_edges: null
  fixed_edge_path: null

  # Frozen-backbone adapter screen.  The public MDLM-OWT safetensors export is
  # prepared as a local state_dict wrapper by
  # scripts/prepare_released_mdlm_owt.py.  It contains raw backbone.* weights
  # and no EMA state; trusted Lightning checkpoints can opt into EMA below.
  training:
    objective_name: conditional_denoising_nll_not_diffusion_elbo
    backbone_mode: frozen
    backbone_checkpoint: null
    require_pretrained_backbone: true
    strict_backbone_checkpoint: true
    use_ema_backbone: false
    deterministic_backbone: true
    head_lr: 3.0e-4
    backbone_lr_multiplier: 0.0
    structured_nll_weight: 1.0
    factorized_aux_weight: 0.0
    topology_strategy: gold_reveal_influence
    topology_weight: 0.1
    topology_temperature: 0.25
    topology_minimum_choices: 2
    topology_edge_weight: 1.0
    topology_anchor_weight: 0.25
    topology_slot_weight: 0.25
    topology_on_validation: false
  sampling:
    # structured_marginal and structured_joint both use this same checkpoint
    # and require the global sampling.predictor=ddpm.
    mode: factorized
