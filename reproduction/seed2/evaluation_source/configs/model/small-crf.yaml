name: small-crf
type: ddit
hidden_size: 768
cond_dim: 128
length: 1024
n_blocks: 12
n_heads: 12
scale_by_sigma: True
dropout: 0.1
tie_word_embeddings: False

crf:
  decoder_layers: 2
  decoder_heads: 8
  decoder_dim: 512
  top_k: 64
  inference_query_chunk_size: 64
  unigram_aux:
    enabled: true
    start_weight: 0.0
    end_weight: 0.1
    warmup_steps: 10000
