schema_version: 1
artifact: causal_smoke_promotion_policy_template
policy_id: contextual-forest-causal-evidence-v1-smoke-routing-v1
policy_status: frozen_template_before_causal_smoke_plan_or_results
template_frozen_utc: '2026-08-31T04:30:34Z'
protocol_id: contextual-forest-causal-evidence-v1
source_manifest_sha256: 611780e313cc0264b40334507844333a5d2dfee661cbf3191d32d128b93a1ca6
source_suite: causal_smoke

# This contract is deliberately technical-only. No gate examines an NLL
# contrast's sign, magnitude, p-value, or confidence-interval position.
analysis_contract:
  analysis_schema_version: 2
  analysis_artifact: contextual_forest_causal_denoising_analysis
  objective: paired_conditional_denoising_nll_per_masked_token
  controls:
    - dynamic_dynamic
    - fixed_dynamic
    - dynamic_fixed
    - static_static
  candidate_k: 128
  support_candidate_ks: [32, 64, 128, 256]
  train_seeds: [1]
  corruption_seeds: [301, 302]
  datasets:
    wikitext103-pinned:
      revision: b08601e04326c79dfdd32d625aee71d232d685c3
    scientific-papers-arxiv-pinned:
      revision: 0c23eb103b9f78874e0ac93d01bbd935fb8f59b1
  mask_rates: [0.50, 0.90]
  expected_num_strata: 4
  expected_source_views:
    - contextual_vs_static
    - contextual_topology_gain
    - contextual_factor_gain
  expected_contrasts:
    - factorized_backbone_vs_contextual_joint
    - singleton_product_vs_contextual_joint
    - parameter_matched_no_edge_vs_contextual_joint
    - matched_permuted_topology_vs_contextual_joint
    - contextual_joint_vs_static_joint
    - contextual_topology_gain_dynamic_factors
    - contextual_topology_gain_fixed_factors
    - contextual_factor_gain_dynamic_topology
    - contextual_factor_gain_fixed_topology
    - topology_by_factor_interaction
  bootstrap:
    method: hierarchical_paired_percentile_bootstrap
    num_resamples: 20000
    base_rng_seed: 2701
    confidence_level: 0.95

technical_gates:
  require_complete_source_artifact_integrity: true
  require_complete_four_arm_factorial: true
  require_identical_pairing_digests: true
  require_identical_masked_tokens_across_arms_and_training_seeds: true
  require_finite_statistics: true
  require_ordered_confidence_intervals: true
  require_no_edge_identity_within_frozen_tolerance: true
  no_edge_absolute_tolerance: 1.0e-10
  require_complete_candidate_support_grid: true
  require_candidate_support_monotone_within_frozen_tolerance: true
  support_monotonicity_absolute_tolerance: 1.0e-6
  require_nonempty_forest_every_condition: true
  require_degree_sequence_preserved_every_record: true
  require_component_sizes_preserved_every_record: true
  minimum_pooled_changed_edge_fraction: 0.95
  minimum_condition_changed_edge_fraction: 0.90

routing:
  primary:
    target_suite: causal_primary
    requires:
      - integrity_complete
      - four_arm_factorial_complete
      - pairing_complete
      - finite_statistics
      - confidence_intervals_ordered
      - no_edge_identity_within_frozen_tolerance
      - candidate_support_grid_complete
      - candidate_support_monotone_within_frozen_tolerance
      - nonempty_forest_every_condition
      - topology_degree_sequence_preserved
      - topology_component_sizes_preserved
      - topology_permutation_gate
