schema_version: 1
protocol_id: contextual-forest-generation-paper-v1
protocol_status: frozen_before_paper_scale_generation
scientific_scope: >-
  Paired document-local infilling generation quality and descriptive runtime
  for the frozen contextual-forest adapter. This protocol does not estimate
  a diffusion ELBO or data likelihood.

parameters:
  candidate_top_k:
    allowed_values: [64, 128, 256]
  dataset_configs:
    - eval_wikitext103_pinned
    - eval_scientific_papers_arxiv_pinned
    - eval_scientific_papers_pubmed_pinned

# These are the only resolved-Hydra-config fields omitted before the complete
# normalized config is compared with resolved_config_projection. The four
# adapter fields remain cryptographically bound to the generation manifest;
# the three control fields remain exactly bound to one of the two named arms.
normalization:
  adapter_manifest_bound_paths:
    - [eval, adapter_checkpoint]
    - [eval, adapter_sha256]
    - [eval, adapter_manifest]
    - [eval, adapter_manifest_sha256]
  arm_manifest_bound_paths:
    - [model, structured_decoder, topology_mode]
    - [model, structured_decoder, factor_mode]
    - [model, structured_decoder, training, topology_weight]

artifacts:
  backbone_checkpoint:
    path: /mnt/contextual-forest/checkpoints/mdlm-owt-backbone.pt
    sha256: 1b7c724d0228b1a2c825185c96642ffd706bd828b237f84512f0e1c7b5765573

arms:
  dynamic_dynamic:
    topology_mode: dynamic
    factor_mode: dynamic
    topology_weight: 0.1
    sampling_modes: [factorized, structured_marginal, structured_joint]
  static_static:
    topology_mode: fixed
    factor_mode: fixed
    topology_weight: 0.0
    sampling_modes: [structured_joint]

generation:
  sequence_length: 256
  span_length: 32
  selection_seed: 31001
  nfe_budgets: [8, 16, 32, 64]
  num_shards: 16
  batch_size: 8
  prompt_policy:
    policy_id: document-local-contiguous-span-v1
    record_selection: first_n_in_pinned_validation_order
    boundary_policy: never_mask_first_or_last_token
  repository:
    require_clean: true
    prompt_builder_same_git_sha: true
  host:
    device: cuda
    precision_policy: checkpoint dtype; DIT-managed bf16 autocast on CUDA
    parameter_dtypes: [torch.float32]
    critical_packages:
      numpy: 1.26.4
      safetensors: 0.4.2
      tokenizers: 0.15.2
      transformers: 4.38.2
  reference_lm:
    model_name_or_path: gpt2-large
    revision: 32b71b12589c2f8d625668d2335a01cac3249519
    sequence_policy: retokenize_decoded_text_score_through_first_nonleading_eos_v1
    runtime_configuration:
      model_name_or_path: gpt2-large
      model_revision: 32b71b12589c2f8d625668d2335a01cac3249519
      model_class: transformers.models.gpt2.modeling_gpt2.GPT2LMHeadModel
      model_config_class: transformers.models.gpt2.configuration_gpt2.GPT2Config
      tokenizer_name_or_path: gpt2-large
      tokenizer_revision: 32b71b12589c2f8d625668d2335a01cac3249519
      tokenizer_class: transformers.models.gpt2.tokenization_gpt2_fast.GPT2TokenizerFast
      tokenizer_vocab_size: 50257
      tokenizer_bos_token_id: 50256
      tokenizer_eos_token_id: 50256
      tokenizer_pad_token_id: 50256
      tokenizer_padding_side: right
      tokenizer_truncation_side: right
      tokenization_policy: fast_tokenizer_right_padding_right_truncation_add_special_tokens_v1
      sequence_policy: retokenize_decoded_text_score_through_first_nonleading_eos_v1
      add_special_tokens: true
      batch_size: 8
      max_length: 256
      requested_dtype: float32
      parameter_dtypes: [torch.float32]
      precision_policy: explicit_checkpoint_dtype_no_autocast_float32_cross_entropy_v1
      device: cuda

