# Exact resolved Hydra config after the seven manifest-bound paths above are
# removed. __DATA_CONFIG__, __VALID_DATASET__, and __CANDIDATE_TOP_K__ are
# materialized solely from the two declared protocol parameters.
resolved_config_projection:
  mode: sample_eval
  diffusion: absorbing_state
  backbone: dit
  parameterization: subs
  time_conditioning: false
  T: 0
  subs_masking: false
  seed: 1
  loader:
    global_batch_size: 512
    eval_global_batch_size: 8
    batch_size: 512
    eval_batch_size: 8
    num_workers: 8
    pin_memory: true
  sampling:
    predictor: ddpm
    crf_reveal: gated
    steps: 128
    noise_removal: true
    num_sample_batches: 2
    num_sample_log: 2
    semi_ar: false
    stride_length: 1
    num_strides: 1
  training:
    ema: 0.0
    antithetic_sampling: true
    importance_sampling: false
    sampling_eps: 0.001
    change_of_variables: false
  eval:
    checkpoint_path: ''
    disable_ema: true
    compute_generative_perplexity: false
    perplexity_batch_size: 8
    compute_perplexity_on_sanity: false
    gen_ppl_eval_model_name_or_path: gpt2-large
    generate_samples: false
    structured_mask_rate: null
    corruption_seed: null
    conditional_records:
      enabled: false
      schema_version: 1
      support_candidate_ks: []
      protocol_id: null
      job_id: null
      arm: null
      train_seed: null
  optim:
    weight_decay: 0
    lr: 0.0003
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
  trainer:
    _target_: lightning.Trainer
    accelerator: cuda
    num_nodes: 1
    devices: 1
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    precision: bf16
    num_sanity_val_steps: 2
    max_steps: 1000000
    log_every_n_steps: 10
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    val_check_interval: 10000
  wandb:
    project: text-diffusion
    notes: Mulan for text
    group: null
    job_type: null
    name: null
    id: None_1
    tags: [loglinear, openwebtext-train-pinned, __VALID_DATASET__]
  checkpointing:
    save_dir: /mnt/contextual-forest/mdlm-generation-paper-v1
    resume_from_ckpt: false
    resume_ckpt_path: /mnt/contextual-forest/mdlm-generation-paper-v1/checkpoints/last.ckpt
  callbacks:
    checkpoint_every_n_steps:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: -1
      save_last: true
      dirpath: /mnt/contextual-forest/mdlm-generation-paper-v1/checkpoints
      verbose: true
      auto_insert_metric_name: false
      every_n_train_steps: 500
    checkpoint_monitor:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val/structured/conditional_nll_per_masked_token
      mode: min
      save_top_k: 1
      save_last: false
      dirpath: /mnt/contextual-forest/mdlm-generation-paper-v1/checkpoints
      filename: best
      auto_insert_metric_name: false
      verbose: true
    learning_rate_monitor:
      _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: step
  data: __DATA_CONFIG__
  model:
    name: contextual-forest-small
    type: ddit
    monitor_metric: val/structured/conditional_nll_per_masked_token
    hidden_size: 768
    cond_dim: 128
    length: 256
    n_blocks: 12
    n_heads: 12
    scale_by_sigma: true
    dropout: 0.1
    tie_word_embeddings: false
    structured_decoder:
      enabled: true
      top_k: __CANDIDATE_TOP_K__
      rank: 16
      time_embed_dim: 64
      topology_dim: 128
      local_window: 2
      num_anchor_slots: 16
      contextual_neighbors: 4
      component_size_cap: 32
      independent_mode: false
      min_edge_score: null
      fixed_edges: null
      fixed_edge_path: null
      training:
        objective_name: conditional_denoising_nll_not_diffusion_elbo
        backbone_mode: frozen
        backbone_checkpoint: /mnt/contextual-forest/checkpoints/mdlm-owt-backbone.pt
        require_pretrained_backbone: true
        strict_backbone_checkpoint: true
        use_ema_backbone: false
        deterministic_backbone: true
        head_lr: 0.0003
        backbone_lr_multiplier: 0.0
        structured_nll_weight: 1.0
        factorized_aux_weight: 0.0
        topology_strategy: gold_reveal_influence
        topology_temperature: 0.25
        topology_minimum_choices: 2
        topology_edge_weight: 1.0
        topology_anchor_weight: 0.25
        topology_slot_weight: 0.25
        topology_on_validation: false
      sampling:
        mode: factorized
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    find_unused_parameters: false
  noise:
    type: loglinear
    sigma_min: 0.0001
    sigma_max: 20
  lr_scheduler:
    _target_: transformers.get_constant_schedule_with_warmup
    num_warmup_steps: 2500
